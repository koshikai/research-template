[project]
name = "ai-research-template"
version = "0.1.0"
description = "AI-driven research template powered by Astral tools"
readme = "README.md"
authors = [{ name = "kaito" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_research_template"]

[tool.uv]
managed = true
package = true
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = ["PLR2004", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
# Target Python version for type checking. (Usually inferred from `project.requires-python`,
# but we pin it here to make behavior explicit.)
python-version = "3.13"

[tool.ty.src]
include = ["src", "scripts", "tests"]

[tool.ty.terminal]
# Treat warning-level diagnostics as failures, approximating a "strict" policy.
error-on-warning = true
